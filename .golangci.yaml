version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell

  settings:
    misspell:
      locale: US

  exclusions:
    rules:
      # Ignore test files for errcheck
      - path: _test\.go
        linters:
          - errcheck
      # Ignore generated protobuf files
      - path: \.pb\.go
        linters:
          - all

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/safabayar/gateway
